name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    # Database tests opt in via TEST_DATABASE_URL and skip when it is unset, so
    # the suite still passes on a clean clone with no Postgres. Here it is set,
    # so they run — and backend/tests/global-setup.ts applies migrations with
    # `prisma migrate deploy`, the same command the Procfile runs on release.
    # There is deliberately no separate migration step in this workflow: one
    # place applies the schema, so the tests and the deploy path cannot drift.
    # See docs/12-testing.md.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buzzalicious_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Deliberately minimal. The test environment lives in one place —
      # backend/tests/setup.ts — and every variable there is assigned with `??=`, so
      # anything set here silently wins over it. The first version of this file
      # duplicated the whole fake environment and mistyped ENCRYPTION_KEY by four
      # characters, which CI then fed to every test in place of the correct value.
      #
      # So: set only what setup.ts cannot know, which is where Postgres is. Nothing
      # here is or may ever be a real credential.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buzzalicious_test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # The floor from package.json engines, not the newest release. CI should
          # fail on the oldest version we claim to support, not the one that happens
          # to be on a developer's machine.
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      # Last, because it is the slowest and the least likely to be the thing
      # that is broken.
      - name: Build
        run: npm run build
